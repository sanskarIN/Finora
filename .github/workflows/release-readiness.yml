name: Repository release readiness

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - ".github/**"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "PROJECT_STATUS.md"
      - "what_changed.md"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".gitignore"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - ".github/**"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "PROJECT_STATUS.md"
      - "what_changed.md"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: finora-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run release-readiness guard tests
        run: python -m unittest discover -s scripts/tests -p "test_check_release_readiness.py" -v

      - name: Check repository release-readiness invariants
        run: python scripts/check_release_readiness.py
