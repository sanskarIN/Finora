name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: finora-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore app
        run: dotnet restore src/Finora.App/Finora.App.csproj

      - name: Build Android analysis target
        run: dotnet build src/Finora.App/Finora.App.csproj -c Release -f net10.0-android --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
