name: Finora CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finora-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  structural-preflight:
    name: Structural preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate repository structure
        run: python build/scripts/verify_structure.py

  core-tests:
    name: Core tests
    needs: structural-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore unit tests
        run: dotnet restore tests/Finora.UnitTests/Finora.UnitTests.csproj
      - name: Restore integration tests
        run: dotnet restore tests/Finora.IntegrationTests/Finora.IntegrationTests.csproj
      - name: Restore UI-contract tests
        run: dotnet restore tests/Finora.UiTests/Finora.UiTests.csproj
      - name: Run unit tests with warnings as errors
        run: dotnet test tests/Finora.UnitTests/Finora.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=unit.trx"
      - name: Run integration tests with warnings as errors
        run: dotnet test tests/Finora.IntegrationTests/Finora.IntegrationTests.csproj -c Release --no-restore --logger "trx;LogFileName=integration.trx"
      - name: Run UI-contract tests with warnings as errors
        run: dotnet test tests/Finora.UiTests/Finora.UiTests.csproj -c Release --no-restore --logger "trx;LogFileName=ui-contract.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 14

  maui-windows:
    name: MAUI Windows
    needs: core-tests
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build Windows with analyzers/warnings as errors
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/native-logs | Out-Null
          dotnet build src/Finora.App/Finora.App.csproj -c Release -f net10.0-windows10.0.19041.0 --verbosity normal *>&1 | Tee-Object -FilePath artifacts/native-logs/windows.log
          exit $LASTEXITCODE
      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-windows
          path: artifacts/native-logs/windows.log
          if-no-files-found: ignore
          retention-days: 14

  maui-android:
    name: MAUI Android
    needs: core-tests
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build Android with analyzers/warnings as errors
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/native-logs | Out-Null
          dotnet build src/Finora.App/Finora.App.csproj -c Release -f net10.0-android --verbosity normal *>&1 | Tee-Object -FilePath artifacts/native-logs/android.log
          exit $LASTEXITCODE
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-android
          path: artifacts/native-logs/android.log
          if-no-files-found: ignore
          retention-days: 14

  maui-ios:
    name: MAUI iOS
    needs: core-tests
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build iOS with analyzers/warnings as errors
        shell: bash
        run: |
          mkdir -p artifacts/native-logs
          set -o pipefail
          dotnet build src/Finora.App/Finora.App.csproj -c Release -f net10.0-ios --verbosity normal 2>&1 | tee artifacts/native-logs/ios.log
      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-ios
          path: artifacts/native-logs/ios.log
          if-no-files-found: ignore
          retention-days: 14

  maui-maccatalyst:
    name: MAUI Mac Catalyst
    needs: core-tests
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build Mac Catalyst with analyzers/warnings as errors
        shell: bash
        run: |
          mkdir -p artifacts/native-logs
          set -o pipefail
          dotnet build src/Finora.App/Finora.App.csproj -c Release -f net10.0-maccatalyst --verbosity normal 2>&1 | tee artifacts/native-logs/maccatalyst.log
      - name: Upload Mac Catalyst build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-maccatalyst
          path: artifacts/native-logs/maccatalyst.log
          if-no-files-found: ignore
          retention-days: 14
