name: Localization validation

on:
  push:
    paths:
      - "src/Finora.App/Resources/Strings/**"
      - "scripts/validate_localization.py"
      - "scripts/tests/test_validate_localization.py"
      - ".github/workflows/localization.yml"
  pull_request:
    paths:
      - "src/Finora.App/Resources/Strings/**"
      - "scripts/validate_localization.py"
      - "scripts/tests/test_validate_localization.py"
      - ".github/workflows/localization.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/validate_localization.py"

      - name: Run localization validator tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Validate Finora resource bundles
        run: python scripts/validate_localization.py
