name: Feature request
description: Propose a Finora product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Finora. Do not include real financial records, receipts, PINs, backup passwords, or other private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem without including private finance data.
      placeholder: I want to… because…
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what Finora should allow the user to accomplish.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts
        - Transactions
        - Categories and tags
        - Budgets
        - Savings goals
        - Recurring items and reminders
        - Dashboard and reports
        - Import, export, backup, and restore
        - Privacy and security
        - Accessibility and localization
        - Platform integration
        - Developer experience and documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include real financial records, credentials, PINs, backup passwords, or private receipt contents.
          required: true
