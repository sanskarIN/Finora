name: Bug report
description: Report a reproducible Finora defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include real finance data, backup passwords, PINs, or security vulnerabilities."
  - type: input
    id: version
    attributes: { label: Finora version }
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: Platform and OS }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
