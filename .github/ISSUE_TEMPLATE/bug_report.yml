name: Bug report
description: Report a reproducible Finora defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real financial records, receipt contents, backup files, backup passwords, PINs, or security vulnerabilities. Security issues must be reported privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Finora version
      placeholder: 0.2.0 (2)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS
      placeholder: Android 16 / Windows 11 / iOS / macOS
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Startup/onboarding
        - Accounts/transfers
        - Transactions/receipts/import/export
        - Categories/tags
        - Budgets
        - Savings goals
        - Recurring/reminders
        - Dashboard/reports
        - Backup/restore
        - Settings/privacy/security
        - Accessibility/localization
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic/example values only.
      placeholder: |
        1. Open…
        2. Tap…
        3. Enter synthetic value…
        4. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security check
      options:
        - label: I used only synthetic/example financial data in this report.
          required: true
        - label: This is not a security vulnerability or exposure of private data.
          required: true
